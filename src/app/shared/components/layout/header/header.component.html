<header class="header">
  <h1 class="header__title"
      tuiTitle="l"
      routerLink="./"
  >Storage-FE</h1>

 @if (authStorage.tokenState$ | async) {
   <button tuiButton
           size="m"
           routerLink="./auth/sign-in"
   >Sign In</button>
 }@else {
   <button tuiButton
           iconStart="arrow-left-from-line"
           size="m"
           (click)="logOut()"
   >Log Out</button>
 }
</header>
