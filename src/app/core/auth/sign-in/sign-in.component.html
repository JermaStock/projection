@defer (on timer(80)) {

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div>
      <label>Login</label>
      <input formControlName="username"/>
    </div>
   <div>
     <label>Password</label>
     <input formControlName="password"/>
   </div>

   <div>
     <button type="submit" [disabled]="form.invalid" tuiButton>Login</button>
   </div>
  </form>

}
