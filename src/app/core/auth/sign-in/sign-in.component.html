@defer (on timer(90)) {

  <form [formGroup]="form">
    <div>
      <label>Login</label>
      <input formControlName="username"/>
    </div>
   <div>
     <label>Password</label>
     <input formControlName="password"/>
   </div>

   <div>
     <button type="button" (click)="submit()" [disabled]="form.invalid" tuiButton>Login request</button>
   </div>
  </form>

}
